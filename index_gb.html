<!DOCTYPE html>
<html lang=es>
<head>
  <meta charset=UTF-8>
  <meta name=viewport content=width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no>
  <meta name=apple-mobile-web-app-capable content=yes>
  <meta name=mobile-web-app-capable content=yes>
  <title>GB/GBC - NFC Retro</title>
  <link rel=stylesheet href=assets/omnipad.css>
  <link rel=stylesheet href=style.css>
</head>
<body>
  <div id=app-container>
    <!-- Game Canvas (Game Boy resolution: 160x144) -->
    <canvas id=screen width=160 height=144></canvas>

    <!-- OmniPad Controls Layer -->
    <div id=controls-layer></div>

    <!-- Status / Loading Overlay -->
    <div id=status-overlay>
      <div class=spinner id=spinner></div>
      <div class=status-text id=status-text>Cargando ROM de Game Boy...</div>
    </div>
  </div>

  <!-- Core Scripts -->
  <script src=cores/wasmboy.js></script>
  <script src=assets/omnipad.js></script>

  <script>
    const canvas = document.getElementById('screen');
    const statusOverlay = document.getElementById('status-overlay');
    const statusText = document.getElementById('status-text');
    const spinner = document.getElementById('spinner');
    const controlsLayer = document.getElementById('controls-layer');

    // Desbloqueo de audio para móviles
    function unlockMobileAudio() {
      if (window.WasmBoy && window.WasmBoy._audioContext) {
        if (window.WasmBoy._audioContext.state === 'suspended') {
          window.WasmBoy._audioContext.resume();
        }
      }
    }
    window.addEventListener('touchstart', unlockMobileAudio, { passive: true });
    window.addEventListener('click', unlockMobileAudio, { passive: true });

    // ==========================================
    // 1. INTEGRACIÓN DE OMNIPAD (TOUCH CONTROLS)
    // ==========================================
    function setupTouchControls() {
      const { VirtualDPad, VirtualButton, TargetZone } = window.OmniPad;

      new TargetZone(controlsLayer, {
        widgetId: '',
        layout: { left: 0, top: 0, width: '100%', height: '100%' }
      });

      // D-Pad
      new VirtualDPad(controlsLayer, {
        targetStageId: '',
        layout: {
          left: '20px',
          bottom: '30px',
          width: '135px',
          height: '135px',
          zIndex: 100
        },
        mapping: {
          up: 'ArrowUp',
          down: 'ArrowDown',
          left: 'ArrowLeft',
          right: 'ArrowRight'
        }
      });

      // Botón B (Game Boy layout: B a la izquierda, A a la derecha)
      new VirtualButton(controlsLayer, {
        label: 'B',
        targetStageId: '',
        mapping: { code: 'KeyX', key: 'x' },
        layout: {
          right: '90px',
          bottom: '35px',
          width: '60px',
          height: '60px',
          zIndex: 100
        }
      });

      // Botón A
      new VirtualButton(controlsLayer, {
        label: 'A',
        targetStageId: '',
        mapping: { code: 'KeyZ', key: 'z' },
        layout: {
          right: '25px',
          bottom: '55px',
          width: '60px',
          height: '60px',
          zIndex: 100
        }
      });

      // Select & Start
      new VirtualButton(controlsLayer, {
        label: 'SELECT',
        targetStageId: '',
        mapping: { code: 'ShiftRight', key: 'Shift' },
        layout: {
          left: 'calc(50% - 65px)',
          bottom: '15px',
          width: '55px',
          height: '28px',
          zIndex: 100
        }
      });

      new VirtualButton(controlsLayer, {
        label: 'START',
        targetStageId: '',
        mapping: { code: 'Enter', key: 'Enter' },
        layout: {
          left: 'calc(50% + 10px)',
          bottom: '15px',
          width: '55px',
          height: '28px',
          zIndex: 100
        }
      });
    }

    // ==========================================
    // 2. INICIALIZACIÓN DE WASMBOY Y AUTO-CARGA
    // ==========================================
    async function initGameBoy() {
      setupTouchControls();

      const params = new URLSearchParams(window.location.search);
      const romUrl = params.get('rom') || 'roms/test.gb';

      try {
        statusText.textContent = 'Configurando WasmBoy...';
        const { WasmBoy } = window.WasmBoy;

        await WasmBoy.config({
          canvas: canvas,
          isAudioEnabled: true,
          isGbcEnabled: true,
          useGbcWhenOptional: true,
          responsiveGamepad: true
        });

        statusText.textContent = Descargando ROM ()...;
        const res = await fetch(romUrl);
        if (!res.ok) {
          throw new Error(ROM no encontrada (HTTP ). Coloca tu archivo en '' o usa ?rom=url);
        }

        const buffer = await res.arrayBuffer();
        const romData = new Uint8Array(buffer);

        statusText.textContent = 'Iniciando juego...';
        await WasmBoy.loadROM(romData);
        await WasmBoy.play();

        spinner.style.display = 'none';
        statusOverlay.classList.add('hidden');
      } catch (err) {
        console.error('Error:', err);
        spinner.style.display = 'none';
        statusText.innerHTML = ⚠️ <b>Error al cargar</b><br><br><br><small>Toca la pantalla para reintentar</small>;
        statusOverlay.onclick = () => location.reload();
      }
    }

    window.addEventListener('DOMContentLoaded', initGameBoy);
  </script>
</body>
</html>
