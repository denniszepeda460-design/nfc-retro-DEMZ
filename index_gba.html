<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>GBA - NFC Retro</title>
  <link rel="stylesheet" href="assets/omnipad.css">
  <link rel="stylesheet" href="style.css">

  <style>
    /* BLOQUEO DE MENÚS Y SELECCIÓN NATIVA */
    body, html, #app-container, #controls-layer, canvas {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      touch-action: none;
      outline: none;
    }

    /* ESTILOS DEL MENÚ DE SISTEMA (GUARDAR) */
    #sys-menu {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 999;
      display: flex;
      gap: 10px;
    }
    .sys-btn {
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: 2px solid #fff;
      border-radius: 8px;
      padding: 8px 15px;
      font-family: sans-serif;
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
    }
    .sys-btn:active {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <div id="app-container">
    <!-- Game Canvas -->
    <canvas id="screen" width="240" height="160"></canvas>

    <!-- UI Sistema -->
    <div id="sys-menu">
      <button id="btn-save" class="sys-btn">💾 Guardar (In-Game)</button>
    </div>

    <!-- OmniPad Controls Layer -->
    <div id="controls-layer"></div>

    <!-- Status / Overlay -->
    <div id="status-overlay">
      <div class="spinner" id="spinner"></div>
      <div class="status-text" id="status-text">Cargando ROM de GBA...</div>
    </div>
  </div>

  <!-- Core Scripts -->
  <script src="cores/iodine.js"></script>
  <script src="assets/omnipad.js"></script>

  <script>
    // Prevenir el menú contextual globalmente
    window.addEventListener('contextmenu', function(e) { e.preventDefault(); });

    const canvas = document.getElementById('screen');
    const statusOverlay = document.getElementById('status-overlay');
    const statusText = document.getElementById('status-text');
    const spinner = document.getElementById('spinner');
    const controlsLayer = document.getElementById('controls-layer');

    const gfx = new GfxGlueCode(240, 160);
    gfx.attachCanvas(canvas);

    let audio = null;
    try { audio = new GlueCodeMixer(); } catch (e) {}

    const iodine = new GameBoyAdvanceEmulator();
    iodine.attachGraphicsFrameHandler(gfx);
    if (audio) { iodine.attachAudioHandler(audio); }

    // El core espera este callback para notificar cambios de play/pause;
    // si no está definido, iodine.play() falla internamente al llamar a pause().
    iodine.playStatusCallback = function(status) {
      // No-op: no necesitamos reaccionar a este evento en la UI por ahora.
    };

    iodine.settings.SKIPBoot = true;
    iodine.settings.dynamicSpeed = false;
    iodine.settings.offthreadGfxEnabled = false;

    let emulatorTimer = null;
    function startEmulationLoop() {
      if (emulatorTimer) return;
      emulatorTimer = setInterval(() => {
        iodine.timerCallback(Date.now());
      }, 16);
    }

    let audioUnlocked = false;
    function unlockMobileAudio() {
      if (audioUnlocked) return;
      if (audio && audio.audio && audio.audio.audioContext) {
        if (audio.audio.audioContext.state === 'suspended') {
          audio.audio.audioContext.resume();
        }
      }
      audioUnlocked = true;
    }
    window.addEventListener('touchstart', unlockMobileAudio, { passive: true });
    window.addEventListener('click', unlockMobileAudio, { passive: true });

    const GBA_BUTTONS = { A: 0, B: 1, SELECT: 2, START: 3, RIGHT: 4, LEFT: 5, UP: 6, DOWN: 7, R: 8, L: 9 };

    const EmulatorBridge = {
      press(btnIndex) { unlockMobileAudio(); iodine.keyDown(btnIndex); },
      release(btnIndex) { iodine.keyUp(btnIndex); }
    };

    const KEYBOARD_MAP = {
      'KeyX': GBA_BUTTONS.A, 'KeyZ': GBA_BUTTONS.B, 'Enter': GBA_BUTTONS.START, 'ShiftRight': GBA_BUTTONS.SELECT,
      'ArrowUp': GBA_BUTTONS.UP, 'ArrowDown': GBA_BUTTONS.DOWN, 'ArrowLeft': GBA_BUTTONS.LEFT, 'ArrowRight': GBA_BUTTONS.RIGHT,
      'KeyA': GBA_BUTTONS.L, 'KeyS': GBA_BUTTONS.R
    };

    window.addEventListener('keydown', (e) => {
      const btn = KEYBOARD_MAP[e.code];
      if (btn !== undefined) { EmulatorBridge.press(btn); e.preventDefault(); }
    });
    window.addEventListener('keyup', (e) => {
      const btn = KEYBOARD_MAP[e.code];
      if (btn !== undefined) { EmulatorBridge.release(btn); e.preventDefault(); }
    });

    // ==========================================
    // 3. INTEGRACIÓN DE OMNIPAD (TOUCH CONTROLS - ESTILO SNES)
    // ==========================================
    function setupTouchControls() {
      const { VirtualDPad, VirtualButton, TargetZone } = window.OmniPad;

      new TargetZone(controlsLayer, { layout: { left: '0px', top: '0px', width: '100%', height: '100%' } });

      // D-Pad
      new VirtualDPad(controlsLayer, {
        layout: { left: '4vmin', bottom: '6vmin', width: '36vmin', height: '36vmin' },
        mapping: { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' }
      });

      // Botón A (Derecha)
      new VirtualButton(controlsLayer, {
        label: 'A', mapping: { code: 'KeyX', key: 'x' },
        layout: { right: '4vmin', bottom: '16vmin', width: '13vmin', height: '13vmin' }
      });

      // Botón B (Abajo)
      new VirtualButton(controlsLayer, {
        label: 'B', mapping: { code: 'KeyZ', key: 'z' },
        layout: { right: '18vmin', bottom: '3vmin', width: '13vmin', height: '13vmin' }
      });

      // Select & Start
      new VirtualButton(controlsLayer, {
        label: 'SELECT', mapping: { code: 'ShiftRight', key: 'Shift' },
        layout: { left: '22%', bottom: '48vmin', width: '18vmin', height: '8vmin' }
      });

      new VirtualButton(controlsLayer, {
        label: 'START', mapping: { code: 'Enter', key: 'Enter' },
        layout: { right: '22%', bottom: '48vmin', width: '18vmin', height: '8vmin' }
      });

      // Gatillos L y R
      new VirtualButton(controlsLayer, {
        label: 'L', mapping: { code: 'KeyA', key: 'a' },
        layout: { left: '4vmin', bottom: '60vmin', width: '22vmin', height: '12vmin' }
      });
      new VirtualButton(controlsLayer, {
        label: 'R', mapping: { code: 'KeyS', key: 's' },
        layout: { right: '4vmin', bottom: '60vmin', width: '22vmin', height: '12vmin' }
      });
    }

    // ==========================================
    // 4. AUTO-CARGA Y ARRANQUE DE LA ROM
    // ==========================================
    document.getElementById('btn-save').addEventListener('click', () => {
      alert('Para guardar juegos en GBA, utiliza el menú de guardado dentro del propio juego (Ej: Menú START -> Guardar).');
    });

    async function loadROM() {
      const params = new URLSearchParams(window.location.search);
      const romUrl = params.get('rom') || 'roms/pokemon_emerald.gba';
      const biosUrl = params.get('bios') || 'bios/gba_bios.bin';

      try {
        // El core requiere un BIOS real de GBA (16384 bytes) para inicializar;
        // sin esto, play() falla internamente y se auto-pausa sin dar ningún error.
        statusText.textContent = 'Descargando BIOS...';
        const biosRes = await fetch(biosUrl, { cache: 'no-store' });
        if (!biosRes.ok) throw new Error(`BIOS no encontrado (HTTP ${biosRes.status}): ${biosUrl}`);
        const biosData = new Uint8Array(await biosRes.arrayBuffer());
        if (biosData.length !== 0x4000) {
          throw new Error(`BIOS inválido: se esperaban 16384 bytes, se encontraron ${biosData.length}`);
        }
        iodine.attachBIOS(biosData);

        statusText.textContent = `Descargando ROM (${romUrl})...`;
        const res = await fetch(romUrl, { cache: 'no-store' });
        if (!res.ok) throw new Error(`ROM no encontrada (HTTP ${res.status}): ${romUrl}`);

        const buffer = await res.arrayBuffer();
        const romData = new Uint8Array(buffer);

        statusText.textContent = 'Iniciando emulador...';
        iodine.attachROM(romData);
        iodine.play();
        startEmulationLoop();

        spinner.style.display = 'none';
        statusOverlay.classList.add('hidden');
      } catch (err) {
        console.error('Error:', err);
        spinner.style.display = 'none';
        statusText.innerHTML = `⚠️ <b>Error al cargar</b><br><br>${err.message}<br><small>Toca la pantalla para reintentar</small>`;
        statusOverlay.onclick = () => location.reload();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      setupTouchControls();
      loadROM();
    });
  </script>
</body>
</html>
