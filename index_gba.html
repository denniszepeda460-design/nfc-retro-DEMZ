<!DOCTYPE html>
<html lang=es>
<head>
  <meta charset=UTF-8>
  <meta name=viewport content=width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no>
  <meta name=apple-mobile-web-app-capable content=yes>
  <meta name=mobile-web-app-capable content=yes>
  <title>GBA - NFC Retro</title>
  <link rel=stylesheet href=assets/omnipad.css>
  <link rel=stylesheet href=style.css>
</head>
<body>
  <div id=app-container>
    <!-- Game Canvas (Native GBA resolution: 240x160) -->
    <canvas id=screen width=240 height=160></canvas>

    <!-- OmniPad Controls Layer -->
    <div id=controls-layer></div>

    <!-- Status / Touch-to-Start Overlay -->
    <div id=status-overlay>
      <div class=spinner id=spinner></div>
      <div class=status-text id=status-text>Cargando ROM de GBA...</div>
    </div>
  </div>

  <!-- Core Scripts -->
  <script src=cores/iodine.js></script>
  <script src=assets/omnipad.js></script>

  <script>
    // ==========================================
    // 1. CONFIGURACIÓN DEL EMULADOR (IodineGBA)
    // ==========================================
    const canvas = document.getElementById('screen');
    const statusOverlay = document.getElementById('status-overlay');
    const statusText = document.getElementById('status-text');
    const spinner = document.getElementById('spinner');
    const controlsLayer = document.getElementById('controls-layer');

    // Inicializar subsistemas de video y audio
    const gfx = new GfxGlueCode(240, 160);
    gfx.attachCanvas(canvas);

    let audio = null;
    try {
      audio = new GlueCodeMixer();
    } catch (e) {
      console.warn('Audio mixer deferred:', e);
    }

    const iodine = new GameBoyAdvanceEmulator();
    iodine.attachGraphicsFrameHandler(gfx);
    if (audio) {
      iodine.attachAudioHandler(audio);
    }

    // Configuración de rendimiento de Iodine
    iodine.settings.SKIPBoot = true;
    iodine.settings.dynamicSpeed = false;
    iodine.settings.offthreadGfxEnabled = false;

    // Loop de ejecución de frames (60 FPS sincronizado con rAF/Interval)
    let emulatorTimer = null;
    function startEmulationLoop() {
      if (emulatorTimer) return;
      emulatorTimer = setInterval(() => {
        iodine.timerCallback((+new Date()).getTime());
      }, 16);
    }

    // Desbloqueo de AudioContext para navegadores móviles (iOS/Android)
    let audioUnlocked = false;
    function unlockMobileAudio() {
      if (audioUnlocked) return;
      if (audio && audio.audio && audio.audio.audioContext) {
        if (audio.audio.audioContext.state === 'suspended') {
          audio.audio.audioContext.resume();
        }
      }
      audioUnlocked = true;
    }
    window.addEventListener('touchstart', unlockMobileAudio, { passive: true });
    window.addEventListener('click', unlockMobileAudio, { passive: true });

    // ==========================================
    // 2. MAPEO DE CONTROLES E INTERMEDIARIO (BRIDGE)
    // ==========================================
    // Índices de botones nativos en IodineGBA:
    // 0: A, 1: B, 2: Select, 3: Start, 4: Right, 5: Left, 6: Up, 7: Down, 8: R, 9: L
    const GBA_BUTTONS = {
      A: 0,
      B: 1,
      SELECT: 2,
      START: 3,
      RIGHT: 4,
      LEFT: 5,
      UP: 6,
      DOWN: 7,
      R: 8,
      L: 9
    };

    // Bridge de entrada para garantizar 0ms de latencia
    const EmulatorBridge = {
      press(btnIndex) {
        unlockMobileAudio();
        iodine.keyDown(btnIndex);
      },
      release(btnIndex) {
        iodine.keyUp(btnIndex);
      }
    };

    // Soporte para teclado físico (para pruebas en Desktop)
    const KEYBOARD_MAP = {
      'KeyX': GBA_BUTTONS.A,
      'KeyZ': GBA_BUTTONS.B,
      'Enter': GBA_BUTTONS.START,
      'ShiftRight': GBA_BUTTONS.SELECT,
      'ShiftLeft': GBA_BUTTONS.SELECT,
      'ArrowUp': GBA_BUTTONS.UP,
      'ArrowDown': GBA_BUTTONS.DOWN,
      'ArrowLeft': GBA_BUTTONS.LEFT,
      'ArrowRight': GBA_BUTTONS.RIGHT,
      'KeyA': GBA_BUTTONS.L,
      'KeyS': GBA_BUTTONS.R
    };

    window.addEventListener('keydown', (e) => {
      const btn = KEYBOARD_MAP[e.code];
      if (btn !== undefined) {
        EmulatorBridge.press(btn);
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', (e) => {
      const btn = KEYBOARD_MAP[e.code];
      if (btn !== undefined) {
        EmulatorBridge.release(btn);
        e.preventDefault();
      }
    });

    // ==========================================
    // 3. INTEGRACIÓN DE OMNIPAD (TOUCH CONTROLS)
    // ==========================================
    function setupTouchControls() {
      const { VirtualDPad, VirtualButton, TargetZone } = window.OmniPad;

      // Zona objetivo principal
      new TargetZone(controlsLayer, {
        widgetId: '',
        layout: { left: 0, top: 0, width: '100%', height: '100%' }
      });

      // 1. D-Pad (Cruceta izquierda)
      new VirtualDPad(controlsLayer, {
        targetStageId: '',
        layout: {
          left: '20px',
          bottom: '30px',
          width: '135px',
          height: '135px',
          zIndex: 100
        },
        mapping: {
          up: 'ArrowUp',
          down: 'ArrowDown',
          left: 'ArrowLeft',
          right: 'ArrowRight'
        }
      });

      // 2. Botón B
      new VirtualButton(controlsLayer, {
        label: 'B',
        targetStageId: '',
        mapping: { code: 'KeyZ', key: 'z' },
        layout: {
          right: '90px',
          bottom: '35px',
          width: '60px',
          height: '60px',
          zIndex: 100
        }
      });

      // 3. Botón A
      new VirtualButton(controlsLayer, {
        label: 'A',
        targetStageId: '',
        mapping: { code: 'KeyX', key: 'x' },
        layout: {
          right: '25px',
          bottom: '55px',
          width: '60px',
          height: '60px',
          zIndex: 100
        }
      });

      // 4. Gatillos L y R
      new VirtualButton(controlsLayer, {
        label: 'L',
        targetStageId: '',
        mapping: { code: 'KeyA', key: 'a' },
        layout: {
          left: '20px',
          top: '20px',
          width: '65px',
          height: '38px',
          zIndex: 100
        }
      });

      new VirtualButton(controlsLayer, {
        label: 'R',
        targetStageId: '',
        mapping: { code: 'KeyS', key: 's' },
        layout: {
          right: '20px',
          top: '20px',
          width: '65px',
          height: '38px',
          zIndex: 100
        }
      });

      // 5. Select & Start
      new VirtualButton(controlsLayer, {
        label: 'SELECT',
        targetStageId: '',
        mapping: { code: 'ShiftRight', key: 'Shift' },
        layout: {
          left: 'calc(50% - 65px)',
          bottom: '15px',
          width: '55px',
          height: '28px',
          zIndex: 100
        }
      });

      new VirtualButton(controlsLayer, {
        label: 'START',
        targetStageId: '',
        mapping: { code: 'Enter', key: 'Enter' },
        layout: {
          left: 'calc(50% + 10px)',
          bottom: '15px',
          width: '55px',
          height: '28px',
          zIndex: 100
        }
      });
    }

    // ==========================================
    // 4. AUTO-CARGA Y ARRANQUE DE LA ROM
    // ==========================================
    async function loadROM() {
      // Obtener ROM desde parámetro URL ?rom= o por defecto roms/test.gba
      const params = new URLSearchParams(window.location.search);
      const romUrl = params.get('rom') || 'roms/test.gba';

      try {
        statusText.textContent = Descargando ROM ()...;
        const res = await fetch(romUrl);
        if (!res.ok) {
          throw new Error(ROM no encontrada (HTTP ). Coloca tu archivo en '' o usa ?rom=url);
        }

        const buffer = await res.arrayBuffer();
        const romData = new Uint8Array(buffer);

        statusText.textContent = 'Iniciando emulador...';
        iodine.attachROM(romData);
        iodine.play();
        startEmulationLoop();

        // Ocultar overlay
        spinner.style.display = 'none';
        statusOverlay.classList.add('hidden');
      } catch (err) {
        console.error('Error al cargar la ROM:', err);
        spinner.style.display = 'none';
        statusText.innerHTML = ⚠️ <b>Error al cargar</b><br><br><br><small>Toca la pantalla para reintentar</small>;
        statusOverlay.onclick = () => location.reload();
      }
    }

    // Inicialización al cargar el DOM
    window.addEventListener('DOMContentLoaded', () => {
      setupTouchControls();
      loadROM();
    });
  </script>
</body>
</html>
